<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لیست قیمت | سازمان تأمین نهاده ایران</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --brand-dark:#0f4d33;
    --brand:#1c7a4f;
    --brand-light:#2fae74;
    --paper:#eef1ee;
    --card:#ffffff;
    --ink:#1a2420;
    --ink-soft:#5b6b62;
    --line:#d8e1db;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Vazirmatn', sans-serif;
    color:var(--ink);
  }

  /* ---------- top toolbar (not printed) ---------- */
  .toolbar{
    position:sticky; top:0; z-index:50;
    background:var(--brand-dark);
    color:#fff;
    padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
  }
  .toolbar h1{font-size:16px; font-weight:600; margin:0; opacity:.9;}
  .toolbar .actions{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{
    border:none; cursor:pointer; font-family:inherit;
    border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--brand-light); color:#042015;}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:rgba(255,255,255,.12); color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,.2);}

  /* ---------- sheet ---------- */
  #sheet{
    max-width:880px;
    margin:28px auto;
    background:var(--paper);
    padding:0 16px 40px;
  }

  .brand-header{
    background:linear-gradient(90deg, var(--brand-dark), var(--brand));
    color:#fff;
    border-radius:14px;
    padding:22px 26px;
    margin-bottom:26px;
    direction:ltr;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
  }
  .brand-header .contact{
    font-size:14px; line-height:2;
    direction:ltr; text-align:left;
    flex:0 0 auto;
  }
  .brand-header .contact div{display:flex; align-items:center; gap:8px; justify-content:flex-start;}
  .brand-header .org-name{
    font-size:22px; margin:0; font-weight:800;
    direction:rtl; text-align:right;
    flex:0 0 auto;
  }
  .brand-header .logo-slot{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    direction:rtl;
  }
  .logo-box{
    display:flex; align-items:center; justify-content:center;
  }
  .logo-box img{
    max-height:64px; max-width:200px; object-fit:contain; display:block;
  }
  .logo-placeholder-label{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:11.5px; font-weight:600; color:#fff;
    background:rgba(255,255,255,.12);
    border:1.5px dashed rgba(255,255,255,.5);
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    text-align:center;
  }
  .logo-placeholder-label:hover{background:rgba(255,255,255,.2);}
  .logo-placeholder-label input{display:none;}
  .logo-current-label{cursor:pointer; display:block;}
  .logo-current-label input{display:none;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:20px;
    position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card.dragging{opacity:.45;}
  .card.drag-over{box-shadow:0 0 0 2px var(--brand-light) inset; border-color:var(--brand-light);}
  .drag-handle{
    cursor:grab;
    font-size:16px;
    color:var(--ink-soft);
    background:#f2f7f4;
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 9px;
    user-select:none;
    line-height:1;
    flex-shrink:0;
  }
  .drag-handle:active{cursor:grabbing;}
  .card-top-right{display:flex; align-items:center; gap:8px;}
  .card-body{display:flex; gap:18px; align-items:flex-start;}
  .card-main{flex:1 1 auto; min-width:0;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;}
  .card h3{
    font-size:18px; font-weight:700; color:var(--brand-dark);
    margin:0 0 10px; padding-bottom:8px; border-bottom:2px solid var(--brand-light);
    display:inline-block;
  }
  .card p.desc{
    font-size:13.5px; color:var(--ink-soft); line-height:2; margin:0 0 14px;
    direction:rtl;
    text-align:right;
    unicode-bidi:isolate;
  }

  /* ---------- product image ---------- */
  .img-col{
    flex:0 0 140px; width:140px; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .img-box{
    width:140px; height:140px; border-radius:12px; overflow:hidden;
    background:#f2f7f4; border:1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .img-box img{width:100%; height:100%; object-fit:cover; display:block;}
  .img-box .placeholder{font-size:12px; color:var(--ink-soft); text-align:center; padding:6px;}
  .img-upload-label{
    font-size:11.5px; font-weight:600; color:var(--brand-dark);
    background:#e7f4ec; border:1px solid var(--brand-light);
    border-radius:8px; padding:5px 10px; cursor:pointer; text-align:center;
  }
  .img-upload-label:hover{background:#d9eee1;}
  .img-upload-label input{display:none;}
  table.spec{
    width:100%; border-collapse:collapse; font-size:13px; margin-bottom:14px;
  }
  table.spec th, table.spec td{
    border:1px solid var(--line); padding:8px 6px; text-align:center;
  }
  table.spec th{background:#f2f7f4; color:var(--brand-dark); font-weight:700;}

  .card-footer{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .prices{display:flex; flex-direction:row; align-items:center; gap:18px; flex-wrap:wrap;}
  .price-line{
    display:flex; align-items:center; gap:8px; font-weight:700; color:var(--brand-dark); font-size:15px;
  }
  .price-label{
    unicode-bidi:isolate;
    direction:rtl;
    white-space:nowrap;
  }
  .price-line.wholesale{color:#8a5a10;}
  .price-line input{
    width:150px; text-align:center; font-family:inherit; font-weight:700; font-size:15px;
    color:var(--brand-dark); border:1.5px solid var(--brand-light); border-radius:8px;
    padding:6px 8px; background:#f7fbf9;
  }
  .price-line.wholesale input{color:#8a5a10; border-color:#e0b25a; background:#fdf6e9;}
  .price-line input:focus{outline:2px solid var(--brand-light); outline-offset:1px;}
  .price-line.hidden-price{display:none;}
  .prices-block{display:flex; flex-direction:row; align-items:center; gap:18px; flex-wrap:wrap;}
  .global-toggles{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:12px 18px; margin-bottom:20px;
  }
  .global-toggles-label{font-size:13px; font-weight:600; color:var(--brand-dark);}
  .price-toggle{
    display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:500;
    color:var(--ink-soft); cursor:pointer; user-select:none;
  }
  .price-toggle input{width:14px; height:14px; cursor:pointer; accent-color:var(--brand);}
  .size-badge{
    background:var(--brand-dark); color:#fff; font-weight:700; font-size:13px;
    border-radius:999px; padding:6px 16px; white-space:nowrap;
  }

  .del-btn{
    background:#fdecea; color:var(--danger); border:1px solid #f3c6c1;
    border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
    font-family:inherit; flex-shrink:0;
  }
  .del-btn:hover{background:#f9d6d2;}

  /* ---------- add product form: fixed drawer on the LEFT ---------- */
  #addFormOverlay{
    position:fixed; inset:0; z-index:150;
    background:rgba(7,18,13,.4);
    display:none;
  }
  #addFormOverlay.open{display:block;}
  #addForm{
    position:fixed;
    top:0; left:0;
    height:100vh;
    width:min(360px, 90vw);
    overflow-y:auto;
    background:var(--card);
    border-left:none;
    border-right:1.5px solid var(--brand-light);
    box-shadow:10px 0 30px rgba(0,0,0,.18);
    padding:20px 22px 30px;
    z-index:151;
    transform:translateX(-100%);
    transition:transform .25s ease;
  }
  #addForm.open{transform:translateX(0);}
  #addForm .addform-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; position:sticky; top:-20px; background:var(--card);
    padding:6px 0 10px; border-bottom:1px solid var(--line);
  }
  #addForm h4{margin:0; color:var(--brand-dark); font-size:16px;}
  #addForm .close-addform{
    border:none; background:#eee; border-radius:8px; cursor:pointer;
    font-size:18px; width:32px; height:32px; flex-shrink:0;
  }
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--ink-soft);}
  .field input, .field textarea{
    width:100%; font-family:inherit; font-size:13.5px; padding:9px 10px;
    border:1px solid var(--line); border-radius:8px; background:#fbfcfb;
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field small{color:#8a968f; font-size:11.5px;}
  .form-actions{display:flex; gap:10px; margin-top:6px;}

  /* ---------- editor controls ---------- */
  .editor-toolbar{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .editor-toolbar label{
    font-size:13px;
    font-weight:600;
    color:var(--brand-dark);
  }
  .brand-multi{position:relative;}
  .brand-multi-trigger{
    min-width:220px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fbfcfb;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:var(--ink);
    text-align:right;
  }
  .brand-multi-trigger .caret{color:var(--ink-soft); font-size:11px;}
  .brand-multi-panel{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    z-index:60;
    min-width:240px;
    max-height:280px;
    overflow:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.14);
    padding:8px;
  }
  .brand-multi.open .brand-multi-panel{display:block;}
  .brand-opt{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 9px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .brand-opt:hover{background:#f2f7f4;}
  .brand-opt input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;}
  .brand-opt-all{font-weight:700;color:var(--brand-dark);}
  .brand-opt-divider{height:1px;background:var(--line);margin:6px 2px;}
  .edit-btn{
    background:#eef5ef;
    color:var(--brand-dark);
    border:1px solid #c9ded0;
    border-radius:8px;
    padding:6px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .edit-btn:hover{background:#e2efe6;}
  .card-actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .pdf-toggle{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12.5px;
    font-weight:700;
    color:var(--brand-dark);
    cursor:pointer;
  }
  .pdf-toggle input{width:16px;height:16px;accent-color:var(--brand);}
  .brand-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    background:#eef6f1;
    color:var(--brand-dark);
    border:1px solid #cfe3d5;
    border-radius:999px;
    padding:4px 9px;
    margin-top:3px;
  }
  .hidden-pdf-badge{
    display:inline-block;
    font-size:11px;
    color:#8a4a2b;
    background:#fff3ed;
    border:1px solid #f2c6b1;
    border-radius:999px;
    padding:3px 8px;
    margin-right:7px;
  }

  /* ---------- shared editor modal ---------- */
  .editor-modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.48);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .editor-modal.open{display:flex;}
  .editor-panel{
    width:min(820px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.22);
    padding:22px;
  }
  .editor-panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    position:sticky;
    top:-22px;
    background:#fff;
    padding:6px 0 12px;
    z-index:2;
    border-bottom:1px solid var(--line);
  }
  .editor-panel-head h4{
    margin:0;
    color:var(--brand-dark);
    font-size:18px;
  }
  .close-editor{
    border:none;
    background:#eee;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    width:36px;
    height:36px;
  }
  .editor-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .editor-grid .full{grid-column:1/-1;}
  .editor-field label{
    display:block;
    margin-bottom:4px;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .editor-field input,
  .editor-field textarea{
    width:100%;
    font-family:inherit;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
  }
  .editor-field textarea{min-height:90px;resize:vertical;}
  .spec-editor{
    border-top:1px solid var(--line);
    margin-top:14px;
    padding-top:12px;
  }
  .spec-row{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:7px;
    margin-bottom:7px;
  }
  .spec-row input{
    width:100%;
    font-family:inherit;
    font-size:12.5px;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:7px;
  }
  .mini-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:7px;
    padding:7px 10px;
    cursor:pointer;
    font-family:inherit;
    font-size:11px;
  }
  .mini-btn.save{background:#e7f4ec;border-color:var(--brand-light);color:var(--brand-dark);font-weight:700;}
  .mini-btn.remove{background:#fdecea;color:var(--danger);border-color:#f3c6c1;}
  .editor-panel-actions{
    display:flex;
    justify-content:flex-start;
    gap:8px;
    margin-top:16px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  @media (max-width:700px){
    .editor-grid{grid-template-columns:1fr;}
    .editor-grid .full{grid-column:auto;}
    .spec-row{grid-template-columns:1fr;}
  }

  /* ---------- login overlay ---------- */
  body.locked{overflow:hidden;}
  #loginOverlay{
    position:fixed; inset:0; z-index:10000;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:rgba(7,18,13,.52);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .login-box{
    width:min(390px,100%);
    background:rgba(255,255,255,.97);
    border-radius:18px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.28);
    text-align:right;
  }
  .login-box h2{margin:0 0 8px;color:var(--brand-dark);font-size:22px;}
  .login-box p{margin:0 0 20px;color:var(--ink-soft);font-size:13px;line-height:1.9;}
  .login-field{margin-bottom:13px;}
  .login-field label{display:block;margin-bottom:5px;color:var(--brand-dark);font-size:12.5px;font-weight:700;}
  .login-field input{
    width:100%; box-sizing:border-box; padding:11px 12px;
    border:1px solid var(--line); border-radius:9px;
    background:#fbfcfb; font-family:inherit; font-size:14px;
    direction:ltr; text-align:left; outline:none;
  }
  .login-field input:focus{border-color:var(--brand-light);box-shadow:0 0 0 2px rgba(47,174,116,.12);}
  #loginBtn{width:100%;margin-top:4px;}
  #loginError{min-height:20px;margin-top:10px;color:var(--danger);font-size:12px;font-weight:600;text-align:center;}
  body:not(.locked) #loginOverlay{display:none;}

  .pdf-export-root {
    width: 794px;
    margin: 0 auto;
    background: #fff;
    color: var(--ink);
    direction: rtl;
    font-family: 'Vazirmatn', sans-serif;
    box-sizing: border-box;
  }

  .pdf-export-root .pdf-page {
    width: 794px;
    height: 1110px;
    max-height: 1110px;
    overflow: hidden;
    background: #fff;
    box-sizing: border-box;
    padding: 14px 22px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    page-break-after: always;
    break-after: page;
  }

  .pdf-export-root .pdf-page:last-child {
    page-break-after: avoid;
    break-after: avoid;
  }

  .pdf-export-root .pdf-page-cover {
    width: 794px;
    height: 1110px;
    max-height: 1110px;
    overflow: hidden;
    padding: 0;
    margin: 0;
    background: #1c7a4f;
  }

  .pdf-export-root .pdf-page-cover img {
    width: 794px;
    height: 1110px;
    object-fit: fill;
    display: block;
  }

  .pdf-export-root .pdf-brand-header {
    background: linear-gradient(90deg, var(--brand-dark), var(--brand));
    color: #fff;
    border-radius: 12px;
    padding: 10px 20px;
    direction: ltr;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 72px;
    box-sizing: border-box;
    flex-shrink: 0;
  }

  .pdf-export-root .pdf-brand-header .contact {
    font-size: 11.5px;
    line-height: 1.7;
    direction: ltr;
    text-align: left;
    flex: 0 0 auto;
  }
  .pdf-export-root .pdf-brand-header .contact div {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pdf-export-root .pdf-brand-header .org-name {
    font-size: 17px;
    margin: 0;
    font-weight: 800;
    direction: rtl;
    text-align: right;
    flex: 0 0 auto;
  }
  .pdf-export-root .pdf-brand-header .logo-slot {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pdf-export-root .pdf-brand-header .logo-box img {
    max-height: 48px;
    max-width: 150px;
    object-fit: contain;
    display: block;
  }

  .pdf-export-root .pdf-page-cards {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
  }

  .pdf-export-root .pdf-page-cards.full-page {
    justify-content: space-between;
    gap: 0;
  }

  .pdf-export-root .pdf-card {
    height: 242px;
    max-height: 242px;
    box-sizing: border-box;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .pdf-export-root .pdf-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .pdf-export-root .pdf-card h3 {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--brand-dark);
    margin: 0;
    padding-bottom: 2px;
    border-bottom: 2px solid var(--brand-light);
    display: inline-block;
  }
  .pdf-export-root .pdf-brand-chip {
    font-size: 10.5px;
    background: #eef6f1;
    color: var(--brand-dark);
    border: 1px solid #cfe3d5;
    border-radius: 999px;
    padding: 2px 8px;
  }

  .pdf-export-root .pdf-card-body {
    display: flex;
    gap: 14px;
    align-items: center;
    flex: 1 1 auto;
  }
  .pdf-export-root .pdf-card-main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;

                    <span class="price-label">مصرف‌کننده:${RLM}</span>
                    <input type="text" class="price-input" data-idx="${idx}" value="${escapeHtml(p.price)}">
                    <span class="price-label">تومان</span>
                  </div>
                  <div class="price-line wholesale ${globalShowPrice2 ? '' : 'hidden-price'}">
                    <span class="price-label">همکاری:${RLM}</span>
                    <input type="text" class="price2-input" data-idx="${idx}" value="${escapeHtml(p.price2 || '')}">
                    <span class="price-label">تومان</span>
                  </div>
                </div>
              </div>
              <div class="size-badge">${escapeHtml(p.size)}</div>
            </div>

            <div class="card-actions">
              <label class="pdf-toggle">
                <input type="checkbox" class="hidden-pdf-toggle" data-idx="${idx}" ${p.hidden_pdf ? 'checked' : ''}>
                عدم نمایش در PDF
              </label>
              <button type="button" class="edit-btn edit-product-btn" data-idx="${idx}">ویرایش محصول</button>
            </div>
          </div>

          <div class="img-col">
            <div class="img-box">${imgInner}</div>
            <label class="img-upload-label">
              تغییر عکس
              <input type="file" accept="image/*" class="img-input" data-idx="${idx}">
            </label>
          </div>
        </div>
      `;

      cardsEl.appendChild(card);
    });

    document.querySelectorAll('.price-input').forEach(inp=>{
      inp.addEventListener('input', e=>{ products[e.target.dataset.idx].price = e.target.value; });
      inp.addEventListener('change', async e=>{
        const p = products[e.target.dataset.idx];
        await sbClient.from('products').update({ price: p.price }).eq('id', p.id);
      });
    });

    document.querySelectorAll('.price2-input').forEach(inp=>{
      inp.addEventListener('input', e=>{ products[e.target.dataset.idx].price2 = e.target.value; });
      inp.addEventListener('change', async e=>{
        const p = products[e.target.dataset.idx];
        await sbClient.from('products').update({ price2: p.price2 }).eq('id', p.id);
      });
    });

    document.querySelectorAll('.edit-product-btn').forEach(btn=>{
      btn.addEventListener('click', e=>openEditor(Number(e.target.dataset.idx)));
    });

    document.querySelectorAll('.hidden-pdf-toggle').forEach(chk=>{
      chk.addEventListener('change', async e=>{
        const idx = Number(e.target.dataset.idx);
        const p = products[idx];
        const hidden = e.target.checked;
        const { error } = await sbClient.from('products').update({ hidden_pdf: hidden }).eq('id', p.id);
        if(error){
          alert('خطا در تغییر وضعیت: ' + error.message);
          e.target.checked = p.hidden_pdf;
          return;
        }
        p.hidden_pdf = hidden;
        render();
      });
    });

    document.querySelectorAll('.img-input').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const idx = Number(e.target.dataset.idx);
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async ev=>{
          products[idx].image = ev.target.result;
          const { error } = await sbClient.from('products')
            .update({ image_url: ev.target.result })
            .eq('id', products[idx].id);
          if(error){ alert('خطا در ذخیره تصویر: ' + error.message); return; }
          render();
        };
        reader.readAsDataURL(file);
      });
    });

    document.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', async e=>{
        const idx = Number(e.target.dataset.idx);
        const p = products[idx];
        if(confirm('این محصول از لیست حذف شود؟')){
          const { error } = await sbClient.from('products').delete().eq('id', p.id);
          if(error){ alert('خطا در حذف: ' + error.message); return; }
          products.splice(idx,1);
          render();
        }
      });
    });

    // Drag & drop
    let dragSourceId = null;
    document.querySelectorAll('#cards .card').forEach(card=>{
      card.addEventListener('dragstart', e=>{
        dragSourceId = card.dataset.id;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        document.querySelectorAll('#cards .card.drag-over').forEach(c=>c.classList.remove('drag-over'));
      });
      card.addEventListener('dragover', e=>{
        e.preventDefault();
        if(card.dataset.id !== dragSourceId) card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', ()=>card.classList.remove('drag-over'));
      card.addEventListener('drop', async e=>{
        e.preventDefault();
        card.classList.remove('drag-over');
        const targetId = card.dataset.id;
        if(!dragSourceId || targetId === dragSourceId) return;

        const fromIdx = products.findIndex(x => String(x.id) === String(dragSourceId));
        const toIdx = products.findIndex(x => String(x.id) === String(targetId));
        if(fromIdx === -1 || toIdx === -1) return;

        const [moved] = products.splice(fromIdx, 1);
        products.splice(toIdx, 0, moved);
        dragSourceId = null;
        render();
        await persistOrder();
      });
    });
  }

  async function persistOrder(){
    if(!sbClient) return;
    const updates = products.map((p, i) => ({ id: p.id, sort_order: i }));
    await sbClient.from('products').upsert(updates, { onConflict: 'id' });
  }

  function rowToProduct(row){
    return {
      id: row.id,
      title: row.title || '',
      desc: row.desc || '',
      spec: row.spec || [],
      size: row.size || '-',
      price: row.price || '0',
      price2: row.price2 || '0',
      image: row.image_url || null,
      brand: row.brand || 'عمومی',
      hidden_pdf: !!row.hidden_pdf
    };
  }

  async function loadProducts(){
    if(!sbClient){
      cardsEl.innerHTML = `<p style="text-align:center;color:#c0392b;padding:20px;">${initError}</p>`;
      return;
    }
    cardsEl.innerHTML = '<p style="text-align:center;color:#5b6b62;padding:20px;">در حال بارگذاری اطلاعات از دیتابیس...</p>';
    let data, error;
    try {
      ({ data, error } = await sbClient.from('products').select('*').order('sort_order', { ascending: true, nullsFirst: false }).order('id'));
      if(error){
        ({ data, error } = await sbClient.from('products').select('*').order('id'));
      }
    } catch(e){
      cardsEl.innerHTML = `<p style="text-align:center;color:#c0392b;padding:20px;">خطای شبکه: ${e.message}</p>`;
      return;
    }

    if(error){
      cardsEl.innerHTML = `<p style="text-align:center;color:#c0392b;padding:20px;">خطا در دیتابیس: ${error.message}</p>`;
      return;
    }

    if(data.length === 0){
      const rowsToInsert = seedProducts.map(p => ({
        title: p.title, desc: p.desc, spec: p.spec, size: p.size,
        price: p.price, price2: p.price2, image_url: p.image,
        brand: p.brand || 'عمومی', hidden_pdf: !!p.hidden_pdf
      }));
      const { data: inserted } = await sbClient.from('products').insert(rowsToInsert).select();
      products = (inserted || []).map(rowToProduct);
    } else {
      products = data.map(rowToProduct);
    }
    render();
  }

  const brandMulti = document.getElementById('brandMulti');
  document.getElementById('brandMultiTrigger').addEventListener('click', e=>{
    e.stopPropagation();
    brandMulti.classList.toggle('open');
  });
  document.addEventListener('click', e=>{
    if(!brandMulti.contains(e.target)) brandMulti.classList.remove('open');
  });
  document.getElementById('brandAllChk').addEventListener('change', e=>{
    if(e.target.checked) selectedBrands.clear();
    render();
  });
  document.getElementById('refreshBrandsBtn').addEventListener('click', ()=>{
    refreshBrandFilter();
    render();
  });

  document.getElementById('closeEditorBtn').addEventListener('click', closeEditor);
  document.getElementById('cancelEditorBtn').addEventListener('click', closeEditor);
  document.getElementById('editorModal').addEventListener('click', e=>{
    if(e.target.id === 'editorModal') closeEditor();
  });
  document.getElementById('addSpecModalBtn').addEventListener('click', ()=>addEditorSpecRow('', ''));

  document.getElementById('saveEditorBtn').addEventListener('click', async ()=>{
    if(editingProductIdx === null) return;
    const p = products[editingProductIdx];
    const spec = [...document.querySelectorAll('#editSpecRows .spec-row')].map(row=>({
      label: row.querySelector('.modal-spec-label').value.trim() || '-',
      value: row.querySelector('.modal-spec-value').value.trim() || '-'
    }));

    const patch = {
      title: document.getElementById('editTitle').value.trim(),
      brand: document.getElementById('editBrand').value.trim() || 'عمومی',
      desc: document.getElementById('editDesc').value.trim(),
      size: document.getElementById('editSize').value.trim() || '-',
      price: document.getElementById('editPrice').value.trim() || '0',
      price2: document.getElementById('editPrice2').value.trim() || '0',
      spec
    };

    if(!patch.title){
      alert('لطفاً نام محصول را وارد کنید.');
      return;
    }

    const { error } = await sbClient.from('products').update(patch).eq('id', p.id);
    if(error){
      alert('خطا در ذخیره تغییرات: ' + error.message);
      return;
    }

    Object.assign(p, patch);
    closeEditor();
    render();
  });

  loadProducts();

  document.getElementById('globalShowPrice').addEventListener('change', e=>{
    globalShowPrice = e.target.checked;
    render();
  });
  document.getElementById('globalShowPrice2').addEventListener('change', e=>{
    globalShowPrice2 = e.target.checked;
    render();
  });

  // ---------- add product drawer ----------
  const addForm = document.getElementById('addForm');
  const addFormOverlay = document.getElementById('addFormOverlay');

  function openAddForm(){
    addForm.classList.add('open');
    addFormOverlay.classList.add('open');
  }
  function closeAddForm(){
    addForm.classList.remove('open');
    addFormOverlay.classList.remove('open');
  }

  document.getElementById('toggleAddBtn').addEventListener('click', ()=>{
    if(addForm.classList.contains('open')) closeAddForm();
    else openAddForm();
  });
  document.getElementById('closeAddFormBtn').addEventListener('click', closeAddForm);
  document.getElementById('cancelAddBtn').addEventListener('click', closeAddForm);
  addFormOverlay.addEventListener('click', closeAddForm);

  async function addProductToList(imageDataUrl){
    const title = document.getElementById('newTitle').value.trim();
    const desc = document.getElementById('newDesc').value.trim();
    const specRaw = document.getElementById('newSpec').value.trim();
    const size = document.getElementById('newSize').value.trim() || '-';
    const price = document.getElementById('newPrice').value.trim() || '0';
    const price2 = document.getElementById('newPrice2').value.trim() || '0';
    const brand = document.getElementById('newBrand').value.trim() || 'عمومی';

    const spec = specRaw.split('\n').filter(l=>l.trim()).map(line=>{
      const [label, ...rest] = line.split(':');
      return {label: (label||'').trim() || '-', value: rest.join(':').trim() || '-'};
    });
    if(spec.length === 0) spec.push({label:'مشخصات', value:'-'});

    const { data, error } = await sbClient.from('products').insert([{
      title, desc, spec, size, price, price2, image_url: imageDataUrl || null,
      brand, hidden_pdf: false
    }]).select();

    if(error){
      alert('خطا در افزودن محصول: ' + error.message);
      return;
    }

    products.push(rowToProduct(data[0]));
    render();

    document.getElementById('newTitle').value = '';
    document.getElementById('newBrand').value = '';
    document.getElementById('newDesc').value = '';
    document.getElementById('newSpec').value = '';
    document.getElementById('newSize').value = '';
    document.getElementById('newPrice').value = '';
    document.getElementById('newPrice2').value = '';
    document.getElementById('newImage').value = '';
    closeAddForm();
  }

  document.getElementById('confirmAddBtn').addEventListener('click', ()=>{
    const title = document.getElementById('newTitle').value.trim();
    if(!title){
      alert('لطفاً نام محصول را وارد کنید.');
      return;
    }
    const file = document.getElementById('newImage').files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = ev => addProductToList(ev.target.result);
      reader.readAsDataURL(file);
    } else {
    addProductToList(null);
    }
  });

  function preloadImage(url) {
    return new Promise((resolve) => {
      if (!url) return resolve(null);
      const img = new Image();
      let resolved = false;
      const done = () => { if (!resolved) { resolved = true; resolve(img); } };
      img.onload = done;
      img.onerror = done;
      img.src = url;
      if (img.complete) done();
      setTimeout(done, 2000);
    });
  }

  // ---------- export to PDF ----------
  document.getElementById('exportBtn').addEventListener('click', async () => {
    const exportBtn = document.getElementById('exportBtn');
    exportBtn.disabled = true;
    exportBtn.textContent = 'در حال ساخت PDF...';
    closeEditor();

    let exportRoot = null;
    try {
      // 1. Filter visible products (by selected brand and hidden_pdf status)
      const visibleProducts = products.filter(p => {
        const brandMatch = selectedBrands.size === 0 || selectedBrands.has((p.brand || 'عمومی').trim() || 'عمومی');
        return brandMatch && !p.hidden_pdf;
      });

      if (visibleProducts.length === 0) {
        alert('هیچ محصولی برای خروجی PDF انتخاب نشده است.');
        exportBtn.disabled = false;
        exportBtn.textContent = 'دریافت PDF';
        return;
      }

      // Preload cover and active logo
      const curLogoImg = document.querySelector('#logoBox img');
      const logoSrc = curLogoImg ? curLogoImg.src : 'logo.png';
      await Promise.all([
        preloadImage('cover.jpg'),
        preloadImage(logoSrc)
      ]);

      // 2. Build PDF DOM container
      exportRoot = document.createElement('div');
      exportRoot.className = 'pdf-export-root';

      // Page 1: Catalog Cover Page
      const coverPage = document.createElement('div');
      coverPage.className = 'pdf-page pdf-page-cover';
      coverPage.innerHTML = `<img src="cover.jpg" alt="جلد کاتالوگ محصولات">`;
      exportRoot.appendChild(coverPage);

      // Subsequent Product Pages (strictly 4 products per page)
      const PER_PAGE = 4;
      const numPages = Math.ceil(visibleProducts.length / PER_PAGE);

      for (let p = 0; p < numPages; p++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'pdf-page';

        // Repeated Brand Header on every product page
        pageDiv.innerHTML = `
          <div class="pdf-brand-header">
            <div class="contact">
              <div>📞 021 - 910 123 23</div>
              <div>🌐 www.taminnahade.com</div>
            </div>
            <div class="logo-slot">
              <div class="logo-box">
                <img src="${escapeHtml(logoSrc)}" alt="لوگو سازمان">
              </div>
            </div>
            <h2 class="org-name">سازمان تأمین نهاده ایران</h2>
          </div>
        `;

        const cardsContainer = document.createElement('div');
        cardsContainer.className = 'pdf-page-cards';

        const pageProducts = visibleProducts.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
        if (pageProducts.length === PER_PAGE) {
          cardsContainer.classList.add('full-page');
        }

        pageProducts.forEach(prod => {
          const card = document.createElement('div');
          card.className = 'pdf-card';

          const specHead = (prod.spec || []).map(s => `<th>${escapeHtml(s.label)}</th>`).join('');
          const specBody = (prod.spec || []).map(s => `<td>${escapeHtml(s.value)}</td>`).join('');

          const imgInner = prod.image
            ? `<img src="${escapeHtml(prod.image)}" alt="${escapeHtml(prod.title)}">`
            : `<div class="placeholder">بدون عکس</div>`;

          const consumerPriceHtml = globalShowPrice
            ? `<div class="pdf-price-line">
                 <span class="price-label">مصرف‌کننده:</span>
                 <span class="pdf-price-val">${escapeHtml(prod.price || '0')}</span>
                 <span class="price-label">تومان</span>
               </div>`
            : '';

          const wholesalePriceHtml = globalShowPrice2
            ? `<div class="pdf-price-line wholesale">
                 <span class="price-label">همکاری:</span>
                 <span class="pdf-price-val">${escapeHtml(prod.price2 || '0')}</span>
                 <span class="price-label">تومان</span>
               </div>`
            : '';

          card.innerHTML = `
            <div class="pdf-card-top">
              <h3>${escapeHtml(prod.title)}</h3>
              <span class="pdf-brand-chip">برند: ${escapeHtml(prod.brand || 'عمومی')}</span>
            </div>
            <div class="pdf-card-body">
              <div class="pdf-card-main">
                <p class="desc">${escapeHtml(rtlPunct(prod.desc))}</p>
                <table class="pdf-spec">
                  <thead><tr>${specHead || '<th>مشخصات</th>'}</tr></thead>
                  <tbody><tr>${specBody || '<td>-</td>'}</tr></tbody>
                </table>
                <div class="pdf-card-footer">
                  <div class="pdf-prices">
                    ${consumerPriceHtml}
                    ${wholesalePriceHtml}
                  </div>
                  <div class="pdf-size-badge">${escapeHtml(prod.size || '-')}</div>
                </div>
              </div>
              <div class="pdf-img-col">
                <div class="pdf-img-box">${imgInner}</div>
              </div>
            </div>
          `;
          cardsContainer.appendChild(card);
        });

        pageDiv.appendChild(cardsContainer);
        exportRoot.appendChild(pageDiv);
      }

      const sheet = document.getElementById('sheet');
      if (sheet) sheet.style.display = 'none';
      document.body.appendChild(exportRoot);
      window.scrollTo(0, 0);

      // Wait a moment for rendering and fonts
      await new Promise(r => setTimeout(r, 150));

      const opt = {
        margin:       0,
        filename:     'لیست-قیمت-تامین-نهاده-ایران.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: 'css' }
      };

      await html2pdf().set(opt).from(exportRoot).save();
    } catch(err) {
      console.error(err);
      alert('خطا در ساخت PDF: ' + err.message);
    } finally {
      if (exportRoot && exportRoot.parentNode) {
        exportRoot.parentNode.removeChild(exportRoot);
      }
      const sheet = document.getElementById('sheet');
      if (sheet) sheet.style.display = '';
      exportBtn.disabled = false;
      exportBtn.textContent = 'دریافت PDF';
    }
  });
</script>
</body>
</html>
